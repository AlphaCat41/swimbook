{{ define "content" }}
<form method="post" action="/register" class="auth-form" id="aform">
    <h1 class="main-title">{{.title}}</h1>
    <div class="input-container">
        <label for="email" class="label">Email:</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" class="input-box" required>
    </div>
    <div class="input-container">
        <label for="password" class="label">Password:</label>
        <input type="password" id="password" name="password" placeholder="********" class="input-box" required>
    </div>
    <div class="input-container">
        <label for="confirm-password" class="label">Comfirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="********" class="input-box"
            required>
        <p id="alert-confirm-pass"></p>
    </div>

    <input type="submit" value="สมัครสมาชิก" class="submit-btn">
    <p class="label">มีบัญชีอยู่แล้ว? <a href="/login" class="label">เข้าสู่ระบบ</a></p>
</form>

<script>
    const form = document.getElementById('aform');
    const pass = document.getElementById("password");
    const confirmPass = document.getElementById("confirm-password");
    const alertPass = document.getElementById("alert-confirm-pass");

    if (pass && confirmPass && alertPass) {
        confirmPass.addEventListener("input", (e) => {
            if (pass.value !== confirmPass.value) {
                alertPass.textContent = "*รหัสไม่ตรงกัน";
                alertPass.style.display = "block";
            } else {
                alertPass.style.display = "none";
            }
        });
    }
    if (pass && alertPass) {
        pass.addEventListener('input', function () {
            if (pass.value.length < 8) {
                alertPass.textContent = "*รหัสต้องยาวอย่างน้อย 8 ตัวอักษร";
                alertPass.style.display = "block";
            } else {
                alertPass.style.display = 'none';
            }
        });
    }
    if (form) {
        // Validation on form submission
        form.addEventListener('submit', function (event) {
            // Check if length is greater than 8
            if (pass.value.length <= 8) {
                // Prevent form submission
                event.preventDefault();
                pass.focus();

            }
            else if (pass.value !== confirmPass.value) {
                event.preventDefault();
                confirmPass.focus();

            }
            else {

            }
        });
    }
</script>

{{ end }}

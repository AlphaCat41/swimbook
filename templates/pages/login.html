{{ define "content" }}
<form method="post" action="/login" class="auth-form">
    <h1>{{.title}}</h1>
    <div class="input-container">
        <label for="email" class="label">Email:</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" class="input-box" required>
    </div>
    <div class="input-container">
        <label for="password" class="label">Password:</label>
        <input type="password" id="password" name="password" placeholder="********" class="input-box" required>
    </div>

    <input type="submit" value="เข้าสู่ระบบ" class="submit-btn">
    <p>ยังไม่มีบัญชี? <a href="/register">ลงทะเบียน</a></p>
</form>


{{ end }}
